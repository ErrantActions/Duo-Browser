name: Duo Browser iOS

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Run one unsigned iPhone simulator build and test job
        required: true
        type: boolean
        default: false
      save_summary:
        description: Save sanitized test counts only (no logs, screenshots, app, or signing files)
        required: true
        type: boolean
        default: false
      test_scope:
        description: Full validation or focused native Duo, Ask Duo, reading, and scanner tests
        required: true
        type: choice
        options:
          - all
          - duo-panel
          - ask-duo
          - reading
          - scanner
        default: all

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: inputs.confirm_run
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      EXPECTED_IOS_SDK: "27.1"
      NATIVE_TEST_SUITE: ${{ inputs.test_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test build and security contracts
        run: |
          node --test Tests/*.test.cjs
          python3 -m unittest discover -s Tests -p "test_*.py"
          node Tests/validate-project.cjs
      - name: Build and test the unsigned iPhone app
        timeout-minutes: 20
        run: bash .github/scripts/test-ios.sh "$NATIVE_TEST_SUITE"
      - name: Produce sanitized test counts
        if: always() && inputs.save_summary
        run: node .github/scripts/test-summary.cjs
      - name: Save sanitized test counts
        if: always() && inputs.save_summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-test-counts
          path: ci-summary/test-counts.json
          retention-days: 1
          if-no-files-found: warn
