name: TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Test, sign, and upload one owner-only Duo Browser beta
        required: true
        type: boolean
        default: false
      build_number:
        description: Optional CFBundleVersion override; blank selects a number above all Apple uploads
        required: false
        type: string
        default: ""
      save_summary:
        description: Save sanitized test counts only (never signing files or raw diagnostics)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    if: vars.ENABLE_TESTFLIGHT == 'true' && inputs.confirm_upload && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      EXPECTED_IOS_SDK: "27.1"
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test build and security contracts
        run: |
          node --test Tests/*.test.cjs
          python3 -m unittest discover -s Tests -p "test_*.py"
          node Tests/validate-project.cjs
      - name: Validate signing and select an Apple-safe build number before compiling
        id: preflight
        timeout-minutes: 5
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash .github/scripts/testflight.sh preflight
      - name: Test native unit suite before signing
        timeout-minutes: 20
        run: bash .github/scripts/test-ios.sh unit
      - name: Archive, sign, and upload the approved beta
        timeout-minutes: 20
        env:
          BUILD_NUMBER: ${{ steps.preflight.outputs.build_number }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash .github/scripts/testflight.sh upload
      - name: Produce sanitized test counts
        if: always() && inputs.save_summary
        run: node .github/scripts/test-summary.cjs
      - name: Save sanitized test counts
        if: always() && inputs.save_summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-counts
          path: ci-summary/test-counts.json
          retention-days: 1
          if-no-files-found: warn
